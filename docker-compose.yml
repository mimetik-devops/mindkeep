services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mindkeep
      POSTGRES_PASSWORD: mindkeep
      POSTGRES_DB: mindkeep
    ports: [ "5433:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mindkeep" ]
      interval: 5s
      retries: 10

  # the `dev` stages: reloading servers over bind mounts. A deploy builds the last stage.
  backend:
    build: { context: ./backend, target: dev }
    env_file: ./backend/.env
    ports: [ "8001:8000" ]
    volumes: [ "./backend:/app", "wikidata:/data" ]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, target: dev }
    env_file: ./frontend/.env
    ports: [ "5163:5163" ]
    volumes: [ "./frontend:/app", "/app/node_modules" ]
    depends_on: [ backend ]

volumes:
  pgdata:
  wikidata:
