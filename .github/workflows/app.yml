# The desktop client: tests on every push, installers on a tag.
#
# The installers are UNSIGNED. That means: Windows shows a SmartScreen warning ("More info"
# -> "Run anyway"), macOS refuses to open the app until you right-click it and choose Open
# (or run `xattr -d com.apple.quarantine`), Linux does not care. Signing needs certificates
# we do not have; when we do, add the signing step to the package job and this note goes.
name: Desktop client

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  package:
    # installers only for a tag, or when asked for by hand: three runners a push is a lot
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            format: app
            installer: dist/*.msi
          - os: macos-latest
            platform: macOS
            format: app
            installer: dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            format: system
            installer: dist/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is the commits since the previous tag
      # Windows and macOS builds carry their own Python, so any 3.12 will do.
      - if: matrix.platform != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.platform != 'linux'
        run: pip install briefcase
      # The .deb is built for the distribution's own Python and Qt, and Briefcase
      # refuses to run from any other interpreter — so no setup-python here: a venv made
      # by the system python3 runs it, and the runtime packages must be present to be
      # found.
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev libgl1 libqt6dbus6 libqt6gui6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0
          python3 -m venv "$HOME/briefcase-venv"
          "$HOME/briefcase-venv/bin/pip" install briefcase
          echo "$HOME/briefcase-venv/bin" >> "$GITHUB_PATH"
      # The tag is the version: pyproject.toml says 0.0.0 in git and is stamped here,
      # before Briefcase reads it. A manual run without a tag builds 0.0.0 artifacts.
      - if: github.ref_type == 'tag'
        run: python stamp.py "$GITHUB_REF_NAME"
        shell: bash
      # CHANGELOG.md is not in git: it is the commits since the previous tag, and
      # Briefcase ships it inside the Linux package (the Briefcase venv puts `python`
      # on the PATH on Linux too)
      - run: python changelog.py
      - run: briefcase create ${{ matrix.platform }} ${{ matrix.format }}
      - run: briefcase build ${{ matrix.platform }} ${{ matrix.format }}
      # ad-hoc on macOS: the app runs, unsigned, after the right-click dance above.
      # Everywhere else there is nothing to sign with, and Briefcase does not ask.
      - if: matrix.platform == 'macOS'
        run: briefcase package macOS app --adhoc-sign
      - if: matrix.platform != 'macOS'
        run: briefcase package ${{ matrix.platform }} ${{ matrix.format }}
      - uses: actions/upload-artifact@v4
        with:
          name: mindstash-${{ matrix.platform }}
          path: client/${{ matrix.installer }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 client/stamp.py "$GITHUB_REF_NAME"
      # the release body is the same generated changelog the Linux package carries,
      # under the unsigned-build note; GitHub's own PR list is appended after it
      - run: |
          {
            echo "Desktop client ${{ github.ref_name }}. These builds are not code-signed:"
            echo "Windows will warn (More info → Run anyway), macOS needs a right-click → Open"
            echo "the first time."
            echo
            python3 client/changelog.py | tail -n +3
          } > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          body_path: notes.md
