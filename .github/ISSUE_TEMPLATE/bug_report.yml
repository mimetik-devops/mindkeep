name: Bug report
description: Something behaves differently from how it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Not a bug: a page the agent wrote that is wrong or thin. Pages are derived from
        their sources — correct the source, or answer the open question in `questions.md`.
        Please do not report a security vulnerability here; see
        [SECURITY.md](https://github.com/mimetik-devops/mindkeep/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a .docx to a fresh bundle
        2. Wait for the run to finish
        3. …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Backend / API
        - Ingest or the agent's behaviour
        - Web app
        - Desktop client (sync or tray app)
        - Deployment / docker compose
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Commit sha for a self-hosted server, or the client version from the tray menu.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Docker Desktop 4.x, Chrome 140 — or: Railway, Ubuntu 24.04"

  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: >
        For a failed run, the error from the Activity tab. For the client, the Log tab.
        Redact tokens and API keys.
      render: text
