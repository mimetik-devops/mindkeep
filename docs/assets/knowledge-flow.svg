<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">From documents to connected knowledge</title><desc id="desc">Add source documents. Mindkeep creates short, linked pages with citations. Your agents read the wiki as synced markdown files.</desc><rect width="1200" height="380" rx="20" fill="#fff0e5"/><g font-family="Arial, Helvetica, sans-serif"><text x="42" y="52" font-size="25" font-weight="700" fill="#302219">Your knowledge, ready for your agents.</text><g fill="white" stroke="#e8d4c5"><rect x="42" y="90" width="320" height="237" rx="15"/><rect x="440" y="90" width="320" height="237" rx="15"/><rect x="838" y="90" width="320" height="237" rx="15"/></g><g fill="none" stroke="#bd450c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M383 206h35m-10-10 10 10-10 10M781 206h35m-10-10 10 10-10 10"/><path d="M69 122h31l13 13v39H69Z M100 122v13h13 M78 148h24M78 159h18"/><path d="M480 140l30-13 28 29-37 17Z M501 173l9-46"/><circle cx="480" cy="140" r="5" fill="#bd450c"/><circle cx="510" cy="127" r="5" fill="#bd450c"/><circle cx="538" cy="156" r="5" fill="#bd450c"/><circle cx="501" cy="173" r="5" fill="#bd450c"/><path d="M870 132h22l8 9h37v35h-67Z M900 120v11m-6-5h12"/></g><g fill="#302219" font-size="23" font-weight="700"><text x="68" y="214">Add your sources</text><text x="466" y="214">Mindkeep connects them</text><text x="864" y="214">Your agents read it</text></g><g fill="#746054" font-size="17"><text x="68" y="250">Notes, PDFs and transcripts.</text><text x="68" y="279">Start with what you already have.</text><text x="466" y="250">Short pages, links and citations.</text><text x="466" y="279">Kept current from the sources.</text><text x="864" y="250">A wiki synced as markdown.</text><text x="864" y="279">Context for the tools you choose.</text></g></g></svg>
